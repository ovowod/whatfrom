      - node:latest
    expected_sections: [Supported tags]
    expected_plan: {}
    rationale:
      note: |
        Node.js 릴리스 표에서 24(krypton)가 Active LTS, 22(jod)가
        Maintenance LTS, 26은 아직 Current다. docker-node 문서가
        "Production applications should only use LTS releases"라고 한 줄로
        못 박고, 버전을 안 적은 태그는 Current를 고른다고도 적는다.
        그래서 `latest`와 `current`는 요구와 정반대로 움직인다. slim과 기본
        태그 중 무엇을 고를지는 이 질문만으로 갈리지 않아 둘 다 넣는다.
      sources:
        - https://raw.githubusercontent.com/nodejs/docker-node/main/README.md
        - https://raw.githubusercontent.com/nodejs/Release/main/README.md
        - https://raw.githubusercontent.com/docker-library/docs/master/node/README.md
        - https://docs.docker.com/build/building/best-practices/

