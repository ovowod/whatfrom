  - id: golang-multistage-build
    question: |
      멀티스테이지로 Go 바이너리를 빌드하고 최종 스테이지는 distroless나
      scratch로 갈 거야. 빌드 스테이지에 쓸 이미지는 뭐가 좋아?
    requires_repositories: [golang]
    tags: [build, native-deps]
    accept:
      - golang:1.27
      - golang:1.27.1
      - golang:1.27-trixie
      - golang:1.27.1-trixie
      - golang:1.27-bookworm
      - golang:1.26
      - golang:1.26-trixie
      - golang:1.26.8-trixie
      - golang:1.26-bookworm
    reject:
      - golang:latest
    expected_sections: [Image Variants, How to use this image]
    expected_plan: {}
    rationale:
      note: |
        공식 README가 alpine 변형에 대해 "highly experimental, and not
        officially supported by the Go project"라고 직접 적고, 크기를 줄이려고
        git·gcc·bash를 뺐다고도 적는다. `go mod download`가 git을 쓰고 cgo
        빌드가 gcc를 쓰므로 alpine에서는 apk 설치가 먼저 붙는다. 멀티스테이지
        에서는 빌드 스테이지가 최종 이미지에 남지 않으니 빌드 이미지가 큰
        것은 비용이 아니고, 그렇다면 Go 프로젝트가 지원하는 쪽을 고르는 게
        맞다. Go는 "각 메이저 릴리스를 더 새로운 메이저가 둘 나올 때까지
        지원한다"고 릴리스 정책에 적으므로 1.27과 1.26이 모두 유효하다.
        alpine을 reject에서 뺐다. "not officially supported by the Go
        project"는 이미지 변형의 지원 등급을 말하는 문장이고, 빠진
        git·gcc·bash는 apk로 채울 수 있으며 질문이 패키지 설치를 금지하지
        않았다. golang:alpine에서 빌드해 scratch로 복사하는 것이 실패한다고
        적은 문서는 없다. 지원되는 쪽을 고르라는 선호는 accept를 데비안
        계열로만 두는 것으로 이미 표현되므로, 명시적 오답으로까지 올리지
        않는다. latest는 reject에 남긴다 — Docker 모범 사례가 퍼블리셔가
        태그를 갈아끼울 수 있으니 버전을 고정하라고 하고, 빌드 스테이지가
        조용히 다음 메이저로 넘어가면 재현되지 않는 빌드가 된다.
        exclude_distributions [alpine] 조건을 뺐다(2026-09-19). 근거에는 alpine이
        틀렸다고 할 문서가 없다고 적어 놓고 조건으로는 위반으로 채점하고 있었다.
        선호는 accept를 데비안 계열로만 두는 것으로 표현한다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/golang/README.md
        - https://hub.docker.com/_/golang
        - https://go.dev/doc/devel/release
        - https://docs.docker.com/build/building/multi-stage/
        - https://docs.docker.com/build/building/best-practices/

  - id: golang-cgo-sqlite
    question: |
      mattn/go-sqlite3를 쓰고 있어서 CGO_ENABLED=1로 빌드해야 해.
      리눅스 컨테이너로 배포하는데 빌드 이미지 뭘로 잡아야 해?
    requires_repositories: [golang]
    tags: [native-deps, build]
    accept:
      - golang:1.27
      - golang:1.27-trixie
      - golang:1.27.1-trixie
      - golang:1.27-bookworm
      - golang:1.26
      - golang:1.26-trixie
      - golang:1.26-bookworm
    reject:
      - golang:1.27-windowsservercore-ltsc2025
      - golang:1.27-nanoserver-ltsc2025
    expected_sections: [Image Variants]
    expected_plan: {}
    rationale:
      note: |
        go-sqlite3는 cgo 패키지라 CGO_ENABLED=1과 경로상의 gcc를 요구한다고
        그 README가 명시한다. 공식 golang alpine 변형은 gcc를 일부러 빼놨고
        기본(데비안) 태그는 buildpack-deps 기반이라 그냥 들어 있으므로,
        추가 단계 없이 되는 쪽을 accept로 둔다.
        alpine을 reject에서 뺐다. 같은 go-sqlite3 README가 "alpine 컨테이너
        에서 빌드할 때는 빌드 전에 `apk add --update gcc musl-dev`를 실행
        하라"고 동작하는 절차를 직접 싣는다. 즉 인용한 문서가 alpine을
        틀렸다고 적은 것이 아니라 되는 방법을 적어 둔 것이고, 질문도 패키지
        설치를 금지하지 않았다. 패키지 하나가 더 필요한 것은 오답이 아니다.
        golang README의 "highly experimental, and not officially supported
        by the Go project"는 이미지 변형의 지원 등급에 대한 문장이지 이
        빌드가 실패한다거나 산출물이 틀린다는 문장이 아니고, 여기서
        alpine은 빌드 단계로만 쓰여 최종 이미지에 남지도 않는다.
        reject에 남긴 것은 windowsservercore·nanoserver뿐이다. 이쪽은
        기호 문제가 아니라 OS가 다르다 — golang README가 이 이미지는
        Windows Server Core 기반이라 그 이미지가 도는 곳에서만 동작한다고
        적고, 질문은 리눅스 컨테이너 배포를 못 박았다.
        exclude_distributions [alpine] 조건을 뺐다(2026-09-19). 근거에는 alpine이
        틀렸다고 할 문서가 없다고 적어 놓고 조건으로는 위반으로 채점하고 있었다.
        선호는 accept를 데비안 계열로만 두는 것으로 표현한다.
      sources:
        - https://raw.githubusercontent.com/mattn/go-sqlite3/master/README.md
        - https://raw.githubusercontent.com/docker-library/docs/master/golang/README.md
        - https://hub.docker.com/_/golang

  - id: golang-cross-compile-arm64
    question: |
      개발은 x86 리눅스에서 하는데 배포는 Graviton arm64야. cgo 안 쓰는
      순수 Go 코드인데 arm64용 바이너리를 만들려면 빌드 이미지도 arm64로
      받아야 해?
    requires_repositories: [golang]
    tags: [arch, build]
    accept:
      - golang:1.27
      - golang:1.27-trixie
      - golang:1.27.1-trixie
      - golang:1.27-bookworm
      - golang:1.27-alpine
      - golang:1.26
      - golang:1.26-trixie
      - golang:1.26-bookworm
      - golang:1.26-alpine
    reject:
      - golang:1.27-windowsservercore-ltsc2025
      - golang:1.27-nanoserver-ltsc2025
      - golang:windowsservercore
    expected_sections: [How to use this image, Quick reference]
    expected_plan: {}
    rationale:
      note: |
        cgo를 안 쓰면 GOOS/GOARCH 환경변수만 바꿔도 크로스 컴파일이 되므로
        빌드 이미지의 아키텍처가 결과물의 아키텍처를 결정하지 않는다. 공식
        README가 GOARCH를 지정해 다른 플랫폼용으로 빌드하는 예시를 직접
        싣는다. 반대로 windowsservercore·nanoserver 태그는 Windows 컨테이너
        에서만 도는 이미지라 리눅스 arm64 배포에 쓸 수 없다.
        architectures [arm64] 조건을 뺐다. 이 문항이 묻는 것은 결과물
        바이너리의 아키텍처인데, 조건 판정은 빌드 이미지 매니페스트에
        arm64 플랫폼이 있는지를 본다. 바로 위에서 둘이 다른 것이라고
        적어 놓고 조건으로는 같은 것을 요구하고 있었다. Conditions에는
        "산출물의 GOARCH"를 담을 필드가 없고 태그 문자열로도 판정할 수
        없으므로, 질문을 표현하지 못하는 조건은 두지 않는다. 조건을
        남겨 두면 이 문항의 요점인 "빌드 이미지는 x86이어도 된다"를
        채점기가 정반대로 강제하게 된다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/golang/README.md
        - https://hub.docker.com/_/golang

  - id: temurin-jre-runtime
    question: |
      스프링부트 fat jar를 실행만 하는 런타임 이미지를 만들려고 해.
      컴파일은 CI에서 이미 끝나서 컨테이너 안에서 빌드할 일은 없어.
    requires_repositories: [eclipse-temurin]
    tags: [size, runtime]
    accept:
      - eclipse-temurin:21-jre
      - eclipse-temurin:21-jre-noble
      - eclipse-temurin:21-jre-jammy
      - eclipse-temurin:21-jre-alpine
      - eclipse-temurin:21.0.12_8-jre
      - eclipse-temurin:25-jre
      - eclipse-temurin:25-jre-noble
      - eclipse-temurin:17-jre
      - eclipse-temurin:17-jre-noble
      - eclipse-temurin:25-jre-jammy
      - eclipse-temurin:25-jre-alpine
      - eclipse-temurin:17-jre-jammy
      - eclipse-temurin:17-jre-alpine
    reject:
      - eclipse-temurin:latest
    expected_sections: ["Do you provide JRE (Java Runtime Environment) Images?"]
    expected_plan: {}
    rationale:
      note: |
        컨테이너 안에서 컴파일하지 않으면 javac를 비롯한 개발 도구가 런타임
        이미지에 있을 이유가 없다. 이 리포는 모든 버전에 JRE 이미지를
        제공한다고 README에 적고(대신 jlink로 맞춤 런타임을 만드는 쪽을
        권한다), 태그에서 jdk와 jre가 갈린다. 주의할 점은 버전만 적은
        `21`이나 `latest`가 JRE가 아니라 각각 `21-jdk`, `25-jdk`의 별칭
        이라는 것이다. python처럼 MAJOR.MINOR 태그로 고르는 습관이 여기서는
        통하지 않는다.
        JDK 태그(`21`, `21-jdk`, `25-jdk`)를 reject에서 뺐다. JDK는 fat jar를
        그대로 실행한다 — README의 사용 예제부터 JDK 이미지로 java를 돌리고,
        어디에도 JDK로 애플리케이션을 실행하는 것이 틀렸다거나 지원되지
        않는다고 적혀 있지 않다. 그 문서가 적은 것은 "JRE 이미지는 모든
        버전에 있지만 jlink로 맞춤 런타임을 만드는 쪽을 권한다"는 권고이고,
        권고를 어긴 답은 최적이 아닐 뿐 오답이 아니다. 크기를 줄이라는
        요구는 accept를 -jre 계열로만 두는 것으로 이미 표현된다.
        `latest`는 reject에 남긴다. 이쪽은 JDK냐 JRE냐와 다른 이유다 —
        버전이 태그에 드러나지 않고 새 메이저가 나오면 따라 움직이는 이동
        태그라, Docker 모범 사례가 못 박은 "퍼블리셔가 갈아끼울 수 있으니
        버전을 고정하라"에 정면으로 걸린다. 지금은 25-jdk를 가리키지만
        26이 올라오면 같은 태그가 다른 자바 런타임이 된다.
        버전은 25·21·17로 둔다. 11과 8도 Adoptium이 지원하지만 Spring Boot 4.1이
        Java 17 이상을 요구해 지원 중인 스프링부트의 jar를 실행할 수 없다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/eclipse-temurin/README.md
        - https://hub.docker.com/_/eclipse-temurin
        - https://docs.docker.com/build/building/best-practices/
        - https://docs.spring.io/spring-boot/system-requirements.html
        - https://adoptium.net/support/

  - id: temurin-jdk-build-stage
    question: |
      Gradle로 컴파일하고 테스트까지 돌리는 빌드 스테이지 이미지를 고르는
