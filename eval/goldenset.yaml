  - id: python-build-stage
    question: |
      파이썬 프로젝트에 멀티스테이지 Dockerfile을 쓰려고 해. 휠 컴파일하고 의존성 설치하는
      빌드 단계용 이미지를 고르는 중인데, 최종 런타임 단계 말고 빌드
      단계에는 어떤 걸 쓰는 게 맞아?
    requires_repositories: [python]
    tags: [build, native-deps]
    accept:
      - python:3.14
      - python:3.14-trixie
      - python:3.14-bookworm
      - python:3.13
      - python:3.13-trixie
      - python:3.13-bookworm
      - python:3.12
      - python:3.11
      - python:3.10
      - python:3.12-trixie
      - python:3.11-trixie
      - python:3.10-trixie
      - python:3.12-bookworm
      - python:3.11-bookworm
      - python:3.10-bookworm
    reject: []
    expected_sections: [Image Variants, How to use this image]
    expected_plan: {}
    rationale:
      note: |
        기본 태그는 buildpack-deps 기반이라 흔한 데비안 개발 패키지를 이미
        갖고 있고, 공식 README도 이 태그를 "다른 이미지를 빌드하는 베이스"로
        설명하면서 임의의 pip install 대부분이 추가 헤더 없이 성공한다고
        한다. 반대로 slim은 확장 모듈 컴파일에 필요한 패키지가 없다고 같은
        문서가 명시한다. 멀티스테이지에서는 빌드 도구가 최종 이미지에 남지
        않으므로 빌드 단계가 큰 것은 비용이 아니다.
        reject를 비웠다. slim과 alpine을 명시적 오답으로 두고 있었는데,
        문서가 말하는 것은 "그 이미지에는 컴파일에 필요한 데비안 패키지가
        없다"이지 "그 이미지로는 빌드할 수 없다"가 아니다. 질문도 패키지를
        더 깔지 말라고 하지 않았고, 실제로 slim에 build-essential을,
        alpine에 build-base를 먼저 까는 빌드 단계는 흔하고 동작한다.
        같은 문서의 "기본 이미지를 강력히 권한다"는 문장은 권고이지
        오답 판정이 아니다. 권장하지 않는 것과 문서가 틀렸다고 적은 것은
        다른 주장이라, 선호는 accept를 기본 태그로만 두는 것으로 이미
        표현되므로 reject에서는 뺀다.
        exclude_distributions [alpine] 조건을 뺐다(2026-09-19). 근거에는 alpine이
        틀렸다고 할 문서가 없다고 적어 놓고 조건으로는 위반으로 채점하고 있었다.
        선호는 accept를 데비안 계열로만 두는 것으로 표현한다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/python/README.md
        - https://docs.docker.com/build/building/multi-stage/
        - https://docs.docker.com/build/building/best-practices/

  - id: python-latest-stable
    question: |
      새로 시작하는 프로젝트라 파이썬 최신 안정 버전으로 가고 싶어.
      베타나 RC 말고 정식 릴리스여야 하고, 태그도 버전이 드러나게
      박아두고 싶어.
    requires_repositories: [python]
    tags: [version]
    accept:
      - python:3.14
      - python:3.14-slim
      - python:3.14-slim-trixie
      - python:3.14-slim-bookworm
      - python:3.14-trixie
      - python:3.14-bookworm
      - python:3.14.7
      - python:3.14.7-slim
      - python:3.14.7-slim-trixie
      - python:3.14-alpine
    reject:
      - python:3.15-rc
      - python:3.15-rc-slim
      - python:3.15-rc-alpine
      - python:3.15.0rc2
      - python:3.15.0rc2-slim
      - python:3.15.0rc1
      - python:3.15.0b1
      - python:3.15.0b1-slim
      - python:3.15.0a8
      - python:3.15.0a8-slim
      - python:latest
    conditions:
      version_prefix: "3.14"
    expected_sections: [Supported tags]
    expected_plan: {}
    rationale:
      note: |
        devguide 버전 표에서 3.15는 prerelease이고 정식 릴리스가 아직
        2026-10이며, 정식으로 나온 것 중 가장 최신 브랜치는 PEP 745가
        2025-10-07에 final을 낸 3.14다.
        이 문항이 노리는 함정은 알파/베타가 아니라 RC다. PEP 790의 3.15
        일정에서 rc1이 2026-08-04, rc2가 2026-09-01에 나왔고 final은
        2026-10-01이라, 지금 3.15는 RC 구간에 들어와 있다. 공식 README의
        Supported tags 목록에도 3.15-rc와 3.15.0rc2가 현재 태그로 올라와
        있어서 "가장 최신"만 보고 고르면 RC를 집기가 가장 쉽다. RC는 이름
        그대로 final 이전의 후보라 "베타나 RC 말고 정식 릴리스"라는 요구를
        알파/베타와 똑같이 정면으로 어긴다. 그래서 단순 오답이 아니라 경보가
        떠야 할 명시적 오답으로 둔다. DB의 3.15 RC 태그는 변형까지 하면
        수십 개라 전부 넣지 않고, 시스템이 실제로 고를 법한 것 — 움직이는
        별칭인 3.15-rc 계열과 번호가 가장 높은 3.15.0rc2/rc1 — 만 대표로
        넣었다. latest는 버전이 태그에 드러나지 않아 "버전을 박아두고
        싶다"는 요구를 만족하지 않는다.
      sources:
        - https://devguide.python.org/versions/
        - https://peps.python.org/pep-0745/
        - https://peps.python.org/pep-0790/
        - https://raw.githubusercontent.com/docker-library/docs/master/python/README.md
        - https://docs.docker.com/build/building/best-practices/

