  - id: postgres-prod-default
    question: |
      새 서비스의 주 데이터베이스로 PostgreSQL을 컨테이너로 띄우려고 해. 특별한 제약은
      없고 앞으로 몇 년은 이 버전으로 갈 거야. 어떤 태그로 시작하면 돼?
    requires_repositories: [postgres]
    tags: [prod, version, baseline]
    accept:
      - postgres:18
      - postgres:18.6
      - postgres:18-trixie
      - postgres:18.6-trixie
      - postgres:18-bookworm
      - postgres:17
      - postgres:17.11
      - postgres:17-trixie
      - postgres:17-bookworm
      - postgres:18.6-bookworm
      - postgres:17.11-trixie
      - postgres:17.11-bookworm
      - postgres:16
      - postgres:16-trixie
      - postgres:16-bookworm
    reject:
      - postgres:19beta3
      - postgres:19beta3-trixie
      - postgres:14
      - postgres:latest
    expected_sections: [Supported tags]
    expected_plan: {}
    rationale:
      note: |
        PostgreSQL은 메이저를 최초 릴리스 후 5년 지원한다. 18이 현재 최신
        메이저(2030-11-14까지)이고 17도 2029-11-08까지라 둘 다 타당하다.
        반대로 14는 2026-11-12에 마지막 마이너를 받고 끝나므로 "앞으로 몇
        년"이라는 요구와 어긋나고, 19는 아직 beta3다. latest를 빼는 이유는
        postgres에서 메이저가 바뀌면 데이터 디렉터리가 호환되지 않아
        pg_upgrade나 덤프·복원이 필요하기 때문이다. 태그가 조용히 메이저를
        넘어가면 그게 그대로 사고가 된다.
        16도 넣었다(2026-09-19). 판단 기준일에 16은 2028-11-09까지 2년 넘게 남아
        "앞으로 몇 년"을 만족한다. 15는 2027-11까지 1년 남짓이라 넣지 않았다.
      sources:
        - https://www.postgresql.org/support/versioning/
        - https://raw.githubusercontent.com/docker-library/docs/master/postgres/README.md
        - https://hub.docker.com/_/postgres
        - https://docs.docker.com/build/building/best-practices/

  - id: postgres-postgis-extension
    question: |
      지도 서비스라 PostGIS를 써야 해. 이미지 크기 줄이려고 alpine 태그를
      보고 있었는데 그렇게 가도 괜찮아?
    requires_repositories: [postgres]
    tags: [native-deps, distro]
    accept:
      - postgres:18
      - postgres:18-trixie
      - postgres:18-bookworm
      - postgres:18.6
      - postgres:18.6-trixie
      - postgres:17
      - postgres:17-trixie
      - postgres:17-bookworm
      - postgres:16
      - postgres:16-trixie
      - postgres:18.6-bookworm
      - postgres:16-bookworm
      - postgres:15
      - postgres:14
      - postgres:15-trixie
      - postgres:14-trixie
      - postgres:15-bookworm
      - postgres:14-bookworm
    reject:
      - postgres:18-alpine
      - postgres:17-alpine
      - postgres:16-alpine
    conditions:
      exclude_distributions: [alpine]
    expected_sections: [Additional Extensions, Image Variants]
    expected_plan: {}
    rationale:
      note: |
        공식 README의 Additional Extensions 절이 이 질문에 직접 답한다.
        기본(데비안) 변형에서는 PostGIS 같은 확장 설치가 "관련 패키지를
        까는 것만큼 간단"하지만, alpine 변형에서는 "postgres-contrib에 없는
        확장은 전부 자기 이미지에서 컴파일해야 한다"고 같은 절이 직접
        적는다. 크기를 위해 alpine을 고르면 그 비용이 빌드 파이프라인으로
        넘어간다.
        여기서는 alpine을 reject에 남긴다. golang-cgo-sqlite처럼 "패키지
        하나 더 깔면 된다"가 아니기 때문이다. 그쪽은 인용한 문서가 되는
        절차를 실어 두었지만, 이 README는 반대로 alpine에서는 그런 절차가
        없고 확장을 직접 빌드해 넣어야 한다고 적는다. PostGIS를 쓰는 것이
        질문의 전제이므로, 그 전제를 문서가 지목한 제약과 정면으로 부딪치는
        변형을 답으로 내놓는 것은 선호의 문제가 아니라 문서를 못 읽은 것이다.
        메이저는 좁히지 않는다. 질문에 버전 요구가 없어 판단 기준일(2026-09-19)에
        지원 중인 18~14를 모두 넣는다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/postgres/README.md
        - https://hub.docker.com/_/postgres
        - https://www.postgresql.org/support/versioning/

  - id: postgres-version-pinned-16
    question: |
      운영 중인 PostgreSQL 클러스터가 16이고 올해는 메이저 업그레이드 일정이 없어.
      스테이징만 컨테이너로 옮기는 중이라 버전이 정확히 같아야 해.
    requires_repositories: [postgres]
    tags: [version]
    accept:
      - postgres:16
      - postgres:16.15
      - postgres:16-trixie
      - postgres:16.15-trixie
      - postgres:16-bookworm
      - postgres:16.15-bookworm
      - postgres:16-alpine
      - postgres:16-alpine3.24
      - postgres:16.15-alpine
      - postgres:16.15-alpine3.24
    reject:
      - postgres:18
      - postgres:17
      - postgres:latest
    conditions:
      version_prefix: "16"
    expected_sections: [Supported tags]
    expected_plan:
      version_prefix: "16"
    rationale:
      note: |
        메이저가 다르면 데이터 디렉터리 포맷이 호환되지 않아 덤프·복원이나
        pg_upgrade가 필요하다. 스테이징을 운영과 맞추는 것이 목적이므로
        메이저 고정은 협상 대상이 아니다. 16은 2028-11-09까지 지원되므로
        고정 자체도 유효하다. 배포판은 묻지 않았으니 alpine을 포함해
        변형을 좁히지 않는다.
      sources:
        - https://www.postgresql.org/support/versioning/
        - https://raw.githubusercontent.com/docker-library/docs/master/postgres/README.md

  - id: postgres-ci-ephemeral
    question: |
      PostgreSQL을 CI 통합테스트에서 잡마다 새로 띄우고 끝나면 버리는 DB로 써. 확장은
      안 쓰고 데이터도 안 남겨. 테스트는 정렬 순서나 문자열 비교 결과에
      의존하지 않아서 ORDER BY 결과를 단정하는 단언은 없어. 러너가 매번
      pull 하니까 가벼웠으면 좋겠어.
    requires_repositories: [postgres]
    tags: [size, ci]
    accept:
      - postgres:18-alpine
      - postgres:18-alpine3.24
      - postgres:18.6-alpine
      - postgres:17-alpine
      - postgres:17-alpine3.24
      - postgres:16-alpine
      - postgres:18.6-alpine3.24
      - postgres:16-alpine3.24
      - postgres:18-alpine3.23
      - postgres:17-alpine3.23
      - postgres:16-alpine3.23
      - postgres:15-alpine
      - postgres:15-alpine3.24
      - postgres:15-alpine3.23
      - postgres:14-alpine
      - postgres:14-alpine3.24
      - postgres:14-alpine3.23
    reject:
      - postgres:19beta3-alpine
      - postgres:latest
    expected_sections: [Image Variants]
    expected_plan: {}
    rationale:
      note: |
        alpine 변형의 실질적인 제약은 contrib 밖의 확장을 직접 컴파일해야
        한다는 것인데, 확장을 안 쓴다고 했으므로 그 제약이 발동할 지점이
        없고 약 5MB 베이스의 크기 이점만 남는다.
        전에 "데이터를 남기지 않으니 로케일·ICU 차이도 걸리지 않는다"고
        적었던 것은 틀려서 고쳤다. 로케일이 정하는 것은 저장이 아니라
        collation이고, PostgreSQL 문서가 ORDER BY와 `<` 같은 비교 연산이
        입력 표현식의 collation을 따른다고 명시한다. 즉 데이터가 한 번도
        디스크에 남지 않아도 도는 동안의 정렬 순서와 비교 결과는 달라지고,
        그 위에 단언을 걸어 둔 테스트는 베이스를 바꾸면 색깔이 바뀐다.
        공식 README도 alpine 변형은 Postgres 15부터 ICU 로케일을 지원하고
        그 이전 버전은 로케일을 지원하지 않는다고 따로 적는다.
        이 문항에서 alpine이 답이 되는 근거는 "데이터를 안 남긴다"가 아니라
        질문이 명시한 "테스트가 정렬 순서나 문자열 비교에 의존하지 않는다"
        쪽이다. 그 전제가 없으면 collation 차이는 그대로 위험이다.
        CI가 매번 다른 메이저를 받으면 재현성이 깨지므로 프리릴리스인 beta와
        메이저가 바뀔 수 있는 latest는 뺀다. `18-alpine` 같은 메이저 별칭도
        패치와 alpine 버전은 따라 움직이지만 메이저는 고정된다. 이미지까지
        완전히 고정하려면 digest로 받아야 하며, 그것은 태그 선택과 별개다.
        메이저는 좁히지 않는다. 질문에 버전도 사용 기간도 없어서, 판단
        기준일(2026-09-18)에 지원 중인 18·17·16·15·14는 모두 요구를
        만족한다. 다만 14는 2026-11-12에 마지막 마이너를 받고 끝나므로
        새로 고정한다면 더 뒤까지 지원되는 메이저가 낫다. 덜 권장될 뿐
        틀린 답은 아니라 accept에 둔다. 15 미만 alpine이 ICU 로케일을
        지원하지 않는다는 제약은 위의 전제 때문에 걸리지 않는다.
        alpine3.23 고정 태그도 넣는다. alpine 3.23은 지원 중인 브랜치이고
        공식 이미지가 3.24와 나란히 계속 발행한다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/postgres/README.md
        - https://hub.docker.com/_/postgres
        - https://www.postgresql.org/docs/current/collation.html
        - https://www.postgresql.org/support/versioning/

  - id: redis-cache-sidecar
    question: |
      Redis에 웹앱 세션이랑 조회 결과만 담아두는 캐시야. 날아가도 다시 채우면 되고
      영속성은 필요 없어. 파드에 사이드카로 붙일 거라 작을수록 좋아.
    requires_repositories: [redis]
    tags: [size]
    accept:
      - redis:8-alpine
      - redis:8.10-alpine
      - redis:8.10.1-alpine
      - redis:8-alpine3.23
      - redis:7-alpine
      - redis:7.4-alpine
      - redis:8.10-alpine3.23
      - redis:8.8-alpine
      - redis:8.6-alpine
      - redis:8.4-alpine
      - redis:8.2-alpine
      - redis:7.2-alpine
      - redis:6-alpine
      - redis:6.2-alpine
    reject:
      - redis:8
      - redis:8-trixie
      - redis:latest
    expected_sections: [Image Variants]
    expected_plan: {}
    rationale:
      note: |
        redis 이미지가 담는 것은 배포판 패키지 스택이 아니라 소스에서 빌드한
        redis-server 바이너리라, 캐시 용도로 쓰는 한 musl 전환이 애플리케이션
        런타임처럼 의존성 설치를 흔들 지점이 없다. 공식 README가 alpine
        변형을 최종 이미지 크기가 최우선일 때의 선택지로 명시하고 그 베이스는
        약 5MB다. 크기가 요구의 1순위이므로 데비안 기본 태그는 어긋난다.
        줄기는 좁히지 않는다. 질문에 버전 제약이 없고, 판단 기준일
        (2026-09-18)에 Redis 버전 관리 문서가 8.10·8.8·8.6·8.4·8.2·7.4·7.2·6.2를
        모두 지원 중으로 표시한다. 6.2는 Extended 릴리스로 2027-04-01까지,
        7.2는 2029-12-01까지 지원되고, 보안 정책도 6.2.x를 연장 지원으로
        적는다. 그래서 지금 발행되는 이 줄기들의 alpine 별칭을 모두 accept에
        둔다. 8.0은 지원 중이지만 공식 이미지가 더는 발행하지 않아 넣지 않는다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/redis/README.md
        - https://hub.docker.com/_/redis
        - https://docs.docker.com/build/building/best-practices/
        - https://redis.io/docs/latest/operate/oss_and_stack/install/version-mgmt/
        - https://github.com/redis/redis/security/policy

  - id: redis-version-pinned-7
    question: |
      사내 공통 라이브러리가 redis 7.x 기준으로만 검증돼 있어서 8로 올리면
      회귀 테스트를 다 다시 돌려야 해. 당분간 7로 묶어두고 싶어.
    requires_repositories: [redis]
    tags: [version]
    accept:
      - redis:7
      - redis:7.4
      - redis:7.4.11
      - redis:7-bookworm
      - redis:7.4-bookworm
      - redis:7-alpine
      - redis:7.4-alpine
      - redis:7.4.11-alpine
      - redis:7.2
      - redis:7.2-alpine
      - redis:7.2-bookworm
    reject:
      - redis:8
      - redis:8-alpine
      - redis:latest
    conditions:
      version_prefix: "7"
    expected_sections: [Supported tags]
    expected_plan:
      version_prefix: "7"
    rationale:
      note: |
        공식 이미지가 7.4와 7.2 계열을 데비안·alpine 양쪽으로 지금도 계속
        발행하고 있어서 7 고정은 유효한 선택지다. 다만 `redis:7`은 7.4.11을
        가리키는 이동 별칭이라 마이너까지 묶고 싶으면 7.4나 7.4.11을 써야
        한다. 변형은 묻지 않았으므로 좁히지 않는다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/redis/README.md
        - https://hub.docker.com/_/redis

  - id: redis-persistence-docs
    question: |
      큐 대기열을 redis에 넣고 있는데 컨테이너 재시작하면 다 날아가.
      데이터가 남게 하려면 어떻게 띄워야 해?
    requires_repositories: [redis]
    tags: [hit, prod]
    accept:
      - redis:8
      - redis:8.10
      - redis:8.10.1
      - redis:8-trixie
      - redis:8-alpine
      - redis:8.10-alpine
      - redis:7.4
      - redis:7.4-alpine
      - redis:8.10-trixie
      - redis:7
      - redis:8.8
      - redis:8.6
      - redis:8.4
      - redis:8.2
      - redis:7.2
      - redis:6.2
      - redis:6
      - redis:8.8-trixie
      - redis:8.6-trixie
      - redis:8.4-trixie
      - redis:7-alpine
      - redis:8.8-alpine
      - redis:8.6-alpine
      - redis:8.4-alpine
      - redis:8.2-alpine
      - redis:7.2-alpine
      - redis:6.2-alpine
      - redis:6-alpine
    reject:
      - redis:latest
    expected_sections: [How to use this image]
    expected_plan: {}
    rationale:
      note: |
        이 문항이 재는 것은 태그 선택이 아니라 영속성 질문에서 공식 README의
        "Start with persistent storage" 절을 끌어오는가다. 그 절은 redis-server
        에 `--save 60 1` 같은 스냅샷 조건을 주고 `/data` 볼륨을 마운트하라고
        하며, 더 깊은 선택(RDB 스냅샷과 AOF, 그리고 둘의 병행)은 redis
        공식 영속성 문서가 설명한다. 영속성 설정은 변형과 무관하므로
        accept를 좁히지 않는다. 줄기도 같은 이유로 좁히지 않고, 판단 기준일
        (2026-09-19)에 지원 중이고 지금 발행되는 줄기를 모두 넣는다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/redis/README.md
        - https://hub.docker.com/_/redis
        - https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/
        - https://redis.io/docs/latest/operate/oss_and_stack/install/version-mgmt/

  - id: nginx-static-spa
    question: |
      React 빌드 산출물만 얹어서 nginx로 정적 파일 서빙하는 컨테이너야. 리버스
      프록시도 아니고 추적 같은 것도 안 붙여. 이미지를 최대한 작게 하고 싶어.
    requires_repositories: [nginx]
    tags: [size, distro]
    accept:
      - nginx:1.31-alpine
      - nginx:1.31.5-alpine
      - nginx:1.31-alpine-slim
      - nginx:1.31.5-alpine-slim
      - nginx:1.31-alpine3.24-slim
      - nginx:1.30-alpine
      - nginx:1.30.4-alpine
      - nginx:1.30-alpine-slim
      - nginx:stable-alpine
      - nginx:stable-alpine-slim
      - nginx:1.30-alpine3.24-slim
      - nginx:stable-alpine3.24-slim
    reject:
      - nginx:1.31
      - nginx:1.31-perl
      - nginx:1.31-otel
      - nginx:latest
    expected_sections: [Image Variants, How to use this image]
    expected_plan: {}
    rationale:
      note: |
        nginx 이미지는 배포판 패키지 스택 위에 도는 애플리케이션 런타임이
        아니라 nginx.org가 빌드한 바이너리를 담으므로, 정적 파일 서빙에서는
        musl 여부가 걸릴 지점이 사실상 없다. 태그 목록에 `-alpine-slim`이
        따로 있고 README의 slim 설명은 기본 태그의 공통 패키지를 빼고
        nginx 실행에 필요한 최소만 담는다고 한다. perl과 otel 변형은 기본
        이미지 위에 쓰지도 않을 모듈을 얹은 것이라 크기 요구와 반대다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/nginx/README.md
        - https://hub.docker.com/_/nginx
        - https://docs.docker.com/build/building/best-practices/

  - id: nginx-stable-branch
    question: |
      사내 규정이 mainline 말고 stable 브랜치만 쓰게 돼 있어. nginx도
      stable로 맞춰야 하는데 어떤 태그를 쓰면 돼?
    requires_repositories: [nginx]
    tags: [version]
    accept:
      - nginx:1.30
      - nginx:1.30.4
      - nginx:stable
      - nginx:1.30-trixie
      - nginx:stable-trixie
      - nginx:1.30-alpine
      - nginx:1.30.4-alpine
      - nginx:stable-alpine
    reject:
      - nginx:1.31
      - nginx:1.31.5
      - nginx:mainline
      - nginx:latest
    conditions:
      version_prefix: "1.30"
    expected_sections: [Supported tags]
    expected_plan: {}
    rationale:
      note: |
        nginx.org 다운로드 페이지가 1.31.5를 Mainline, 1.30.4를 Stable로
        나눠 배포하고 리눅스 패키지 저장소도 기본이 stable, mainline은
        따로 켜는 구조다. 공식 이미지의 태그 목록에서 `stable`/`1.30`이
        stable 브랜치를, `mainline`/`1`/`latest`가 1.31.5를 가리킨다.
        규정이 stable을 못 박았으므로 latest는 요구를 정면으로 어긴다.
        공식 README의 태그 목록은 `1.30.4`·`stable`·`1.30`을 한 줄에,
        `1.30.4-trixie`·`stable-trixie`·`1.30-trixie`를 다음 줄에,
        `1.30.4-alpine`·`stable-alpine`·`1.30-alpine`을 또 다음 줄에
        묶는다. 즉 `stable` 계열은 1.30.4와 같은 이미지의 다른 이름이다.
        조건 version_prefix "1.30"을 둔다. 조건은 태그의 파생 값으로
        판정하므로 `stable` 계열은 같은 이미지인 `1.30`에서 버전 1.30을
        물려받아 통과하고, `mainline`·`latest`는 1.31이라 걸린다. 태그
        이름으로만 판정하던 때는 `stable`이 조건 위반이 되는 모순 때문에
        이 조건을 뺐었다. expected_plan에는 버전을 적지 않는다. 질문이
        못 박은 것은 번호가 아니라 브랜치다.
      sources:
        - https://nginx.org/en/download.html
        - https://nginx.org/en/linux_packages.html
        - https://raw.githubusercontent.com/docker-library/docs/master/nginx/README.md
        - https://hub.docker.com/_/nginx

  - id: nginx-otel-tracing
    question: |
      게이트웨이로 쓰는 nginx에서 OpenTelemetry 분산 추적 스팬을 내보내야
      해. 지금 이미지에는 모듈이 없는 것 같은데 어떤 태그를 써야 해?
    requires_repositories: [nginx]
    tags: [hit, variant]
    accept:
      - nginx:1.31-otel
      - nginx:1.31.5-otel
      - nginx:mainline-otel
      - nginx:1.31-alpine-otel
      - nginx:1.30-otel
      - nginx:1.30.4-otel
      - nginx:stable-otel
      - nginx:stable-alpine-otel
      - nginx:mainline-alpine-otel
      - nginx:1.30-alpine-otel
    reject:
