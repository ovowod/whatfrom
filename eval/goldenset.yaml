# whatfrom 골든셋 v1 — 리포 10종 40문항.
#
# 라벨 작성 및 검토 기준:
#   1. accept/reject에는 존재를 확인한 이미지 태그를 적는다. 확인 범위는 아래와 같다.
#   2. rationale.sources에는 판정 근거를 확인한 문서 URL을 적는다.
#   3. requires_repositories 중 하나라도 색인되지 않았으면 문항은 미측정이다.
#   4. 질문의 요구를 만족하는 답이 여러 개라면 accept에 함께 포함한다.
#
# 기존 검토에서 Python 태그는 DB의 image_tags로, 나머지는 공식 README의
# 태그 목록으로 존재를 확인했다. 모든 태그가 로컬 DB에 수집됐다는 뜻은 아니다.
# 같은 문항이 허용하는 버전·변형 조합의 누락도 검토했지만,
# 이 목록이 모든 유효한 태그를 포함한다고 보장하지는 않는다.
#
# accept는 정답으로 인정할 목록이고, reject는 명시적 오답 경보를 표시할 목록이다.
# 추천 정확도는 accept 포함 여부로 계산하므로 두 목록에 없는 답도 오답 처리된다.
# reject는 단순한 선호 차이가 아니라 질문의 필수 제약을 어기는 경우에 사용한다.
#
# 버전: 질문이 버전을 요구하지 않으면 판단 기준일에 업스트림이 지원 중인 줄기를
# 모두 허용한다. 덜 권장되는 버전도 틀린 답은 아니다(기준 4). 질문이 버전·기간·
# 안정성을 요구하거나, 인용한 문서가 그 버전으로는 요구를 만족할 수 없다고 적은
# 경우에만 좁히고, 그 이유를 문항의 근거에 적는다.
# 판단 기준일(2026-09-19)의 지원 줄기와 출처:
#   python 3.14~3.10 (3.10은 2026-10 종료)  https://devguide.python.org/versions/
#   node 26(Current)·24·22                  https://github.com/nodejs/Release
#   postgres 18~14 (14는 2026-11-12 종료)   https://www.postgresql.org/support/versioning/
#   redis 8.10·8.8·8.6·8.4·8.2·7.4·7.2·6.2
#     https://redis.io/docs/latest/operate/oss_and_stack/install/version-mgmt/
#   eclipse-temurin 25·21·17·11·8 (26은 EOSL)  https://adoptium.net/support/
#   alpine 3.24~3.21 (3.21은 2026-11-01 종료)  https://alpinelinux.org/releases/
# Python에서 서드파티 패키지의 최신 배포본이 오래된 Python을 지원하지 않아도 버전을
# 가르지 않는다. pip은 Requires-Python에 맞는 이전 배포본을 고른다.
#   https://packaging.python.org/en/latest/guides/dropping-older-python-versions/
# 전에는 Python만 bugfix 단계(3.14·3.13)로 좁혔다. security 단계에는 바이너리
# 설치본이 없다는 것이 근거였는데, 공식 이미지는 소스를 받아 직접 컴파일하므로
# 근거가 되지 못해 폐기했다.
#
# 질문: requires_repositories는 모델에 전달되지 않는다. 그래서 답이 될 제품을
# 질문에서 알 수 있어야 한다. 제품명이나 그 제품에만 해당하는 단서(FastAPI,
# Express, Java 17, PostGIS 등)를 넣는다. "베이스를 최대한 작게"처럼 요구가
# 제품을 정하는 경우는 예외로 둔다.
#
# 추출 정답: expected_plan은 질문에 **명시된** 검색 조건이다. 검색 조건 추출(LLM #1)의
# 정답이며, 답이 지켜야 할 조건(conditions)과 다르다. conditions에는 문서 지식에서 나온
# 조건(torch → alpine 제외)도 있지만 expected_plan에는 질문에 적힌 것만 적는다.
#   - 묻기만 한 것("alpine으로 가도 괜찮아?", "a와 b가 뭐가 달라?")은 조건이 아니다.
#     비교하려고 적은 태그의 버전("python:3.14랑 3.14-slim")도 요구가 아니다.
#   - 사용자가 안 된다고 말한 것("alpine에서 깨진다")은 제외 조건이다.
#   - 지정과 제외가 함께 나오면 둘 다 적는다.
#   - 다른 이미지의 베이스로 적힌 우분투 릴리스는 코드네임으로 적는다(22.04 → jammy).
#     ubuntu 이미지 자체의 버전은 version_prefix에 번호로 적는다.
#   - 크기는 숫자가 있을 때만 적는다. 40문항에는 없다.
#   - 리포지토리는 적지 않는다. requires_repositories가 정답이다.
#   - 모든 문항이 키를 가진다. 조건이 없으면 expected_plan: {}다.
#
# 조건: conditions는 필수 요구만 담는다. 근거가 "가능하지만 권하지 않는다"고 적은
# 선택지는 accept에서 빼는 것으로만 표현하고, 조건으로 위반 처리하지 않는다.
version: 1
# 아래 라벨들이 인용한 출처를 마지막으로 전부 열어 확인한 날이다. latest가 무엇인지,
# 어느 버전이 LTS인지, 최신 패치가 몇인지는 시간이 지나면 낡는다.
# 2026-09-18~19에는 일부만 다시 검토했다. 9-18에는 네 문항의 질문과 허용 목록을
# 고쳤다. 9-19에는 위 버전 원칙을 모든 문항에 적용해 허용 목록을 넓히고, 근거와
# 어긋난 exclude_distributions 조건 4개를 빼고, 제품이 드러나지 않던 질문 7개에
# 제품명을 넣었다. 버전 원칙의 출처는 9-19에 확인했지만 나머지 근거의 출처는 다시
# 열지 않았으므로 이 날짜는 전체 검토일로 둔다. 9-19 뒤에 node-alpine-vs-slim의 허용
# 목록을 위 버전 원칙대로 넓히고 nginx-stable-branch의 버전 조건을 되살렸지만, 근거의
# 출처를 다시 열지 않아 날짜는 그대로다.
verified_on: 2026-09-12
cases:
  - id: python-numpy-arm64
    question: |
      FastAPI 서비스이고 numpy를 사용해. 이미지 크기는 작았으면
      좋겠지만 빌드 안정성이 더 중요해. ARM64에서도 실행해야 해.
    requires_repositories: [python]
    tags: [size, arch, native-deps]
    accept:
      - python:3.14-slim
      - python:3.14-slim-trixie
      - python:3.14-slim-bookworm
      - python:3.14-bookworm
      - python:3.14-trixie
      - python:3.13-slim
      - python:3.13-slim-trixie
      - python:3.13-slim-bookworm
      - python:3.13-bookworm
      - python:3.13-trixie
      - python:3.12-slim
      - python:3.11-slim
      - python:3.10-slim
      - python:3.12-slim-trixie
      - python:3.11-slim-trixie
      - python:3.10-slim-trixie
      - python:3.12-slim-bookworm
      - python:3.11-slim-bookworm
      - python:3.10-slim-bookworm
      - python:3.12-bookworm
      - python:3.11-bookworm
      - python:3.10-bookworm
      - python:3.12-trixie
      - python:3.11-trixie
      - python:3.10-trixie
    reject: []
    conditions:
      architectures: [arm64]
    expected_sections: [Image Variants]
    expected_plan:
      architectures: [arm64]
    rationale:
      note: |
        alpine을 reject에서 뺐다. python-scientific-stack과 같은 전제를
        쓰면서 결론만 다르게 둘 수는 없기 때문이다. 이 문항이 따지는
        arm64/aarch64에서도 근거는 같은 방향이다. numpy는 musllinux_1_2
        휠을 x86_64와 aarch64 둘 다 올리고(2.5.3 기준 cp312~cp315),
        FastAPI 쪽 네이티브 의존인 pydantic-core도 musllinux_1_1_aarch64
        휠을 올린다. 공식 README의 아키텍처 목록도 변형별로 갈리지 않아
        alpine 태그 역시 arm64v8을 지원한다. 즉 arm64라는 조건 때문에
        alpine만 따로 틀렸다고 할 문서 근거가 없다.
        공식 README가 musl libc는 "libc 요구의 깊이에 따라 문제를 겪는
        경우가 잦다"고 경고하는 것은 사실이지만, 이 경고는 아키텍처와
        무관하게 모든 musl 사용에 걸리는 일반 경고라 scientific-stack에서
        오답으로 치지 않은 것을 여기서만 오답으로 칠 근거가 되지 못한다.
        권장하지 않는 것과 명시적 오답은 다른 주장이므로, 크기보다 빌드
        안정성을 위에 둔 요구에 맞춰 accept는 slim/데비안 계열로 좁혀 두되
        alpine은 accept에도 reject에도 넣지 않는다. 공식 이미지는 arm64v8을
        지원하므로 ARM64 요구는 어느 데비안 변형이든 만족한다.
        exclude_distributions [alpine] 조건을 뺐다(2026-09-19). 근거에는 alpine이
        틀렸다고 할 문서가 없다고 적어 놓고 조건으로는 위반으로 채점하고 있었다.
        선호는 accept를 데비안 계열로만 두는 것으로 표현한다.
      sources:
        - https://hub.docker.com/_/python
        - https://raw.githubusercontent.com/docker-library/docs/master/python/README.md
        - https://pypi.org/project/numpy/
        - https://pypi.org/project/pydantic-core/
        - https://pythonspeed.com/articles/alpine-docker-python/

  - id: python-size-first
    question: |
      웹훅 중계 서버야. requirements는 httpx랑 pydantic 정도뿐이고,
      httpx는 순수 파이썬, pydantic은 Rust로 짠 pydantic-core를 쓰지만
      PyPI에 musllinux 휠이 올라와 있어서 musl 환경에서도 컴파일 없이
      깔린다. 레지스트리 비용 때문에 이미지 크기를 최대한 줄이는 게
      1순위야.
    requires_repositories: [python]
    tags: [size]
    accept:
      - python:3.14-alpine
      - python:3.14-alpine3.24
      - python:3.14-alpine3.23
      - python:3.13-alpine
      - python:3.13-alpine3.24
      - python:3.14-slim
      - python:3.14-slim-trixie
      - python:3.13-slim
      - python:3.13-slim-trixie
      - python:3.13-alpine3.23
      - python:3.12-alpine
      - python:3.11-alpine
      - python:3.10-alpine
      - python:3.12-alpine3.24
      - python:3.11-alpine3.24
      - python:3.10-alpine3.24
      - python:3.12-alpine3.23
      - python:3.11-alpine3.23
      - python:3.10-alpine3.23
      - python:3.12-slim
      - python:3.11-slim
      - python:3.10-slim
      - python:3.12-slim-trixie
      - python:3.11-slim-trixie
      - python:3.10-slim-trixie
    reject:
      - python:3.14
      - python:3.14-trixie
      - python:latest
    conditions:
      max_size_mb: 100
    expected_sections: [Image Variants]
    expected_plan: {}
    rationale:
      note: |
        질문의 전제를 고쳤다. 전에는 "순수 파이썬이고 C 확장이 하나도
        없다"면서 pydantic을 의존으로 들었는데, pydantic의 검증 코어인
        pydantic-core는 Rust로 구현된 네이티브 확장이라 전제 자체가 틀린
        문항이었다. 다만 네이티브 코어가 있다는 사실만으로 alpine이
        불가능하다고 결론 낼 수는 없다 — 갈리는 것은 musllinux 휠의 유무다.
        PyPI의 pydantic-core는 musllinux_1_1 휠을 x86_64·aarch64·armv7l로
        올리고 httpx는 py3-none-any 하나뿐이라, 이 스택은 alpine에서도 소스
        빌드로 떨어지지 않는다. 그래서 musl/glibc 차이가 휠 설치에 걸릴
        지점이 없고 alpine의 단점이 사라진 채 크기 이점만 남는다. 공식
        README가 alpine 변형을 "최종 이미지 크기가 최우선 관심사일 때
        유용하다"고 못 박은 경우가 정확히 이 상황이다. slim도 기본 이미지의
        1/9 수준이라 함께 넣는다. DB 실측으로 alpine 약 20MB, slim 약 46MB,
        기본 태그 약 415MB라 기본 태그는 크기 최우선 요구와 정면으로
        어긋난다.
      sources:
        - https://hub.docker.com/_/python
        - https://raw.githubusercontent.com/docker-library/docs/master/python/README.md
        - https://pypi.org/project/pydantic-core/
        - https://pypi.org/project/httpx/
        - https://docs.docker.com/build/building/best-practices/

  # 후보 선택은 질문을 보지 않고 지원 중인 줄기마다 태그를 내며 리포당 최대
  # 20개로 자른다. 3.12 태그도 후보에 오르지만 3.12로 좁히는 일은 LLM의 선택에
  # 달려 있다. 질문으로 후보를 좁히는 F7이 도착했을 때 그 가치를 보여줄 문항이다.
  - id: python-version-pinned-312
    question: |
      회사 내부 라이브러리가 파이썬 3.12에서만 검증돼 있어서 런타임을 3.12로
      고정해야 해. 3.13 이상으로 올리면 CI가 깨져. 어떤 태그를 써야 해?
    requires_repositories: [python]
    tags: [version]
    accept:
      - python:3.12
      - python:3.12-slim
      - python:3.12-slim-bookworm
      - python:3.12-slim-trixie
      - python:3.12-bookworm
      - python:3.12-trixie
      - python:3.12-alpine
      - python:3.12.14
      - python:3.12.14-slim
    reject:
      - python:3.14
      - python:3.14-slim
      - python:3.14-alpine
      - python:3.14-trixie
      - python:3.14-bookworm
      - python:3.13-slim
      - python:latest
    conditions:
      version_prefix: "3.12"
    expected_sections: [Supported tags]
    expected_plan:
      version_prefix: "3.12"
    rationale:
      note: |
        3.12는 devguide 버전 표에서 security 단계이고 EOL이 2028-10이라
        아직 지원 범위 안이며, 공식 이미지도 3.12 계열 태그를 계속 낸다.
        버전을 못 박은 요구이므로 3.12로 시작하는 태그만 정답이고 변형
        선택(slim/alpine/데비안)은 열려 있다.
        3.14 계열은 변형과 무관하게 같은 이유로 틀리므로 전부 오답으로 둔다.
      sources:
        - https://devguide.python.org/versions/
        - https://raw.githubusercontent.com/docker-library/docs/master/python/README.md

