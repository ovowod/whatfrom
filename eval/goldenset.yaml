      note: |
        temurin의 베이스는 데비안이 아니라 우분투이고 jammy·noble·resolute가
        그 릴리스 코드네임이다. README가 추가 패키지를 설치할 거라면
        코드네임을 명시해 우분투 새 릴리스 때 깨지는 것을 줄이라고 직접
        권하는데, 지금 `17-jdk`와 `17`의 실제 베이스는 resolute이므로
        코드네임을 박지 않으면 jammy용 .deb이 실제로 깨진다. Java 17은
        LTS이고 Adoptium이 최소 2027-10까지 지원하므로 고정 자체는 유효하다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/eclipse-temurin/README.md
        - https://hub.docker.com/_/eclipse-temurin
        - https://adoptium.net/support/

  - id: debian-slim-runtime
    question: |
      Rust로 만든 바이너리 하나만 담는 Debian 기반 런타임 베이스가 필요해. glibc랑
      ca-certificates 정도만 있으면 되고 이미지는 작을수록 좋아.
    requires_repositories: [debian]
    tags: [size, distro]
    accept:
      - debian:13-slim
      - debian:trixie-slim
      - debian:13.6-slim
      - debian:trixie-20260824-slim
      - debian:12-slim
      - debian:bookworm-slim
    reject:
      - debian:13
      - debian:trixie
      - debian:sid-slim
      - debian:testing-slim
      - debian:latest
    expected_sections: [Image Variants, About this image]
    expected_plan:
      distributions: [debian]
    rationale:
      note: |
        debian 이미지는 원래 minbase 변형이라 이미 작지만, `-slim` 태그는
        거기서 man 페이지나 문서처럼 컨테이너에서 보통 필요 없는 파일을 더
        덜어낸 것이다. 다만 공식 README가 이 태그를 "an experiment ...
        definitely subject to change"라고 적으므로 날짜가 붙은 태그로
        고정하는 선택도 타당해서 함께 넣었다. sid와 testing은 개발이
        진행 중인 굴러가는 스위트라 런타임 베이스가 될 수 없다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/debian/README.md
        - https://hub.docker.com/_/debian
        - https://www.debian.org/releases/

  - id: debian-codename-vs-number
    question: |
      debian:13이랑 debian:trixie가 뭐가 다른 거야? 그냥 debian:stable
      써도 되는 거 아니야?
    requires_repositories: [debian]
    tags: [hit, version]
    accept:
      - debian:13
      - debian:trixie
      - debian:13.6
      - debian:13-slim
      - debian:trixie-slim
      - debian:12
      - debian:bookworm
      - debian:12-slim
      - debian:13.6-slim
      - debian:bookworm-slim
    reject:
      - debian:stable
      - debian:testing
      - debian:sid
      - debian:latest
    expected_sections: [About this image, Supported tags]
    expected_plan: {}
    rationale:
      note: |
        `13`과 `trixie`는 같은 이미지다. 공식 README가 stable 릴리스는 버전
        번호로도 태그된다고 적고(`debian:11`은 `debian:bullseye`의 별칭),
        태그 목록에서도 trixie·13.6·13·latest가 한 줄에 묶여 있다. 반면
        `stable`/`testing`/`unstable`은 굴러가는 스위트 이름을 그대로
        sources.list에 쓰는 태그라 데비안이 다음 릴리스를 내는 순간 가리키는
        대상도 apt 저장소도 통째로 바뀐다. 지금 stable은 trixie지만 forky가
        testing에서 올라오면 같은 태그가 다른 OS가 된다.
      sources:
        - https://raw.githubusercontent.com/docker-library/docs/master/debian/README.md
        - https://hub.docker.com/_/debian
        - https://www.debian.org/releases/

  - id: ubuntu-lts-base
    question: |
      벤더가 Ubuntu용 .deb만 주는 모니터링 에이전트를 이미지에 넣어야 해.
      프로덕션에서 몇 년 굴릴 거라 오래 지원되는 쪽이면 좋겠어.
    requires_repositories: [ubuntu]
    tags: [prod, version, distro]
    accept:
      - ubuntu:24.04
      - ubuntu:noble
      - ubuntu:26.04
      - ubuntu:resolute
      - ubuntu:22.04
      - ubuntu:jammy
    reject:
      - ubuntu:26.10
      - ubuntu:stonking
      - ubuntu:devel
      - ubuntu:rolling
      - ubuntu:latest
    expected_sections: ["What's in this image?", Supported tags]
    expected_plan:
      distributions: [ubuntu]
    rationale:
      note: |
        우분투는 2년마다 LTS를 내고 LTS는 5년의 표준 보안 유지보수를 받는
        반면, 중간(interim) 릴리스는 9개월만 업데이트를 받고 Canonical도
        프로덕션에는 LTS를 쓰라고 적는다. 태그 목록에서 26.10(stonking)과
        그 별칭 `devel`이 그 중간 릴리스다. `rolling`은 LTS 여부와 무관하게
        최신 릴리스를, `latest`는 최신 LTS를 따라가는 이동 태그라 벤더
        패키지가 특정 릴리스용이면 언젠가 조용히 깨진다.
      sources:
        - https://hub.docker.com/_/ubuntu
        - https://raw.githubusercontent.com/docker-library/docs/master/ubuntu/README.md
        - https://ubuntu.com/about/release-cycle
        - https://docs.docker.com/build/building/best-practices/

  - id: ubuntu-noble-pinned
    question: |
      GPU 드라이버랑 CUDA 저장소가 24.04용만 올라와 있어서 베이스를 24.04로
      고정해야 해. 코드네임으로 써야 하는 건지도 헷갈려.
    requires_repositories: [ubuntu]
    tags: [version, distro]
    accept:
      - ubuntu:24.04
      - ubuntu:noble
      - ubuntu:noble-20260905
    reject:
      - ubuntu:22.04
      - ubuntu:jammy
      - ubuntu:26.04
      - ubuntu:resolute
      - ubuntu:rolling
      - ubuntu:latest
    expected_sections: [Supported tags]
    expected_plan:
      version_prefix: "24.04"
    rationale:
      note: |
        `24.04`와 `noble`은 태그 목록에서 한 줄에 묶인 같은 이미지라 어느
        쪽으로 써도 결과가 같다. 날짜가 붙은 `noble-20260905`는 빌드까지
        고정한다. 주의할 것은 지금 `latest`와 `rolling`이 둘 다 26.04
        (resolute)를 가리킨다는 점이다. "latest는 LTS니까 안전하다"는 통념에
        기대면 24.04 전용 저장소를 쓰는 이 요구는 그대로 깨진다.
        conditions에 version_prefix "24.04"를 두지 않는다. 조건은 태그의
        파생 값으로 판정하므로 `noble`은 같은 이미지인 `24.04`에서 버전을
        물려받아 통과한다. 그러나 날짜 태그는 새 빌드가 나오면 `24.04`와
        digest가 갈라진다. 2026-09-19 수집 기준 `noble-20260905`는 이전
        빌드라 같은 이미지의 번호 태그가 없어 파생 버전이 비어 있고,
        태그 이름으로 판정하면 "24.04"로 시작하지 않아 조건 위반이 된다.
        빌드까지 고정한 올바른 답을 accept에서 빼는 대신 조건을 두지
        않는다. 24.04 밖의 답은 허용 목록 밖이라 추천 정확도에서 오답이다.
      sources:
        - https://hub.docker.com/_/ubuntu
        - https://raw.githubusercontent.com/docker-library/docs/master/ubuntu/README.md
        - https://docs.docker.com/build/building/best-practices/

  - id: alpine-static-binary
    question: |
      정적 링크된 CLI 바이너리 하나에 ca-certificates랑 curl만 얹어서
      배포하려고 해. 베이스를 최대한 작게 가져가고 싶은데 어떤 태그를 써야 해?
    requires_repositories: [alpine]
    tags: [size, version]
    accept:
      - alpine:3.24
      - alpine:3.24.1
      - alpine:3.23
      - alpine:3.23.5
      - alpine:3.22
      - alpine:3.22.5
      - alpine:3.21
      - alpine:3.21.7
    reject:
      - alpine:edge
      - alpine:20260805
      - alpine:latest
    expected_sections: ["What is Alpine Linux?", Supported tags]
    expected_plan: {}
    rationale:
      note: |
        alpine은 musl libc와 BusyBox로 구성한 약 5MB 이미지라 정적 바이너리에
        apk로 몇 개만 얹는 용도에 정확히 맞는다. 고를 때 갈리는 것은 릴리스
        브랜치다. `edge`는 릴리스가 아니라 매년 5월·11월에 여기서 브랜치를
        떠가는 개발 줄기이고 지원 종료일이라는 개념 자체가 없다.
        주의할 것은 지원 기간이 저장소마다 다르다는 점이다. 릴리스 페이지가
        "main 저장소는 보통 2년, community 저장소는 다음 안정 릴리스까지"
        지원한다고 명시한다. 즉 두 저장소가 같은 기간 지원되는 것이 아니다.
        지금 표에서 최신인 v3.24만 2028-06-01까지 main과 community가 함께
        지원 등급으로 잡혀 있고, v3.23(2027-11-01)과 v3.22(2027-05-01)는
        이미 main만 남았다 — 다음 안정 릴리스가 나오면서 community 지원이
        끝났기 때문이고, v3.24도 v3.25가 나오는 순간 같은 자리로 내려간다.
        이 요구에서 그 차이가 답을 바꾸지는 않는다. 얹으려는 것이
        ca-certificates와 curl뿐인데 둘 다 main 패키지라 accept에 넣은
        3.21까지 전부 지원 기간 안에 있다. 3.21은 main이 2026-11-01까지
        지원되어 2026-09-19에 더했다. 그래도 "3.24는 2028년까지
        community도 지원된다"를 다른 브랜치로 일반화하면 틀린다.
        릴리스 브랜치로 고정하는 것이 맞고 `latest`는 새 브랜치가 나면
        따라 움직인다.
      sources:
        - https://hub.docker.com/_/alpine
        - https://raw.githubusercontent.com/docker-library/docs/master/alpine/README.md
        - https://alpinelinux.org/releases/
        - https://docs.docker.com/build/building/best-practices/
