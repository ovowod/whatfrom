      - nginx:1.31-alpine
      - nginx:1.31-perl
      - nginx:latest
    expected_sections: [Supported tags, Image Variants]
    expected_plan: {}
    rationale:
      note: |
        ngx_otel_module은 기본 nginx에 내장된 기능이 아니라 설정에서
        `load_module`로 적재하는 별도 동적 모듈이고, 1.25.3부터
        nginx-module-otel 패키지로 배포된다. 공식 이미지의 `-otel` 태그가
        바로 그 패키지를 기본 이미지 위에 설치한 변형이다(해당 Dockerfile이
        `FROM nginx:1.31.5` 위에 nginx-module-otel을 깐다). 그래서 이건
        취향 문제가 아니라 그 변형을 고르지 않으면 기능이 없는 문제다.
