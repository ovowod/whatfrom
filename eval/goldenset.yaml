  - id: node-arm64-graviton
    question: |
      Node.js 서비스를 AWS Graviton 노드풀에만 배포할 거라 arm64에서만
      돌면 돼. 크기 때문에 alpine으로 가려고 했는데 괜찮을까?
    requires_repositories: [node]
    tags: [arch, distro]
    accept:
      - node:24-slim
      - node:24-bookworm-slim
      - node:24-trixie-slim
      - node:24
      - node:24-bookworm
      - node:lts-slim
      - node:lts-bookworm-slim
      - node:lts
      - node:22-slim
      - node:22-bookworm-slim
      - node:lts-bookworm
      - node:lts-trixie-slim
      - node:22
      - node:22-bookworm
      - node:22-trixie-slim
      - node:26-slim
      - node:26-bookworm-slim
      - node:26-trixie-slim
      - node:26
      - node:26-bookworm
    reject:
      - node:24-alpine
      - node:lts-alpine
      - node:22-alpine
      - node:26-alpine
    conditions:
      architectures: [arm64]
      exclude_distributions: [alpine]
    expected_sections: [Quick reference, Image Variants]
    expected_plan:
      architectures: [arm64]
    rationale:
      note: |
        공식 이미지의 지원 아키텍처에 arm64v8이 있으므로 arm64 자체는
        문제가 아니다. 문제는 alpine 변형이 Node.js의 musl 빌드를 쓴다는
        점이다. docker-node 문서가 amd64 musl 빌드조차 지원 등급
        "Experimental"이고 arm64를 포함한 나머지 아키텍처의 musl 빌드는
        릴리스 전에 테스트되지 않는다고 명시한다. 같은 문서가 데비안
        이미지의 아키텍처는 tier 1 또는 2라 프로덕션 권장이라고 적는다.
        arm64 + alpine은 문서가 가장 약하다고 말하는 조합이다.
        alpine을 reject에 남긴 이유를 못 박아 둔다. 여기서 걸리는 것은
        "패키지를 하나 더 깔면 되는" 종류가 아니다. docker-node 문서가
        musl 빌드의 지원 등급을 Experimental — "컴파일되지 않거나 테스트가
        통과하지 않을 수 있고 코어 팀이 이 플랫폼용 릴리스를 만들지 않는다"
        — 로 적고, arm64를 포함한 amd64 외 아키텍처의 musl 빌드는 릴리스
        전에 테스트조차 되지 않는다고 적는다. 이건 등급이 명시된 문서상의
        제약이고, 질문이 배포 대상으로 못 박은 arm64에서 실제로 돌 런타임
        자체가 그 등급에 걸린다. 빌드 편의가 아니라 배포물의 문제다.
        26도 넣었다(2026-09-19). Current 단계지만 2029-04-30까지 지원되는 줄기이고
        질문이 프로덕션 LTS를 요구하지 않는다. docker-node 문서의 "Production
        applications should only use LTS releases"는 프로덕션을 명시한
        node-lts-prod에서만 좁히는 근거로 쓴다.
      sources:
        - https://raw.githubusercontent.com/nodejs/docker-node/main/README.md
        - https://raw.githubusercontent.com/docker-library/docs/master/node/README.md
        - https://raw.githubusercontent.com/nodejs/Release/main/README.md

