services:
  db:
    image: pgvector/pgvector:pg17
    container_name: whatfrom-db
    environment:
      POSTGRES_USER: whatfrom
      POSTGRES_PASSWORD: whatfrom
      POSTGRES_DB: whatfrom
    ports:
      - "5432:5432"
    volumes:
      - whatfrom_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatfrom -d whatfrom"]
      interval: 3s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: whatfrom-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Linux에는 host.docker.internal이 기본으로 없다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.0.9
    container_name: whatfrom-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      # 로컬 측정용이라 로그인 없이 연다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  whatfrom_pgdata:
