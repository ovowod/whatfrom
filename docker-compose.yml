services:
  db:
    image: pgvector/pgvector:pg17
    container_name: whatfrom-db
    environment:
      POSTGRES_USER: whatfrom
      POSTGRES_PASSWORD: whatfrom
      POSTGRES_DB: whatfrom
    ports:
      - "5432:5432"
    volumes:
      - whatfrom_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatfrom -d whatfrom"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  whatfrom_pgdata:
